<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>ESP32 Robot Remote</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary-color: #6c5ce7;
      --text-color: #2d3436;
      --border-radius: 22px;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    h2 {
      margin-bottom: 20px;
      font-weight: 700;
      color: #2d3436;
      letter-spacing: -0.5px;
      font-size: 26px;
    }

    .main-wrapper {
      display: flex;
      gap: 30px;
      width: 1040px;
      max-width: 96vw;
    }

    .panel {
      background: var(--card-bg);
      padding: 30px;
      border-radius: var(--border-radius);
      box-shadow: 0 12px 35px rgba(108, 92, 231, 0.07);
      border: 1px solid rgba(223, 230, 233, 0.8);
      box-sizing: border-box;
    }

    .left-panel {
      flex: 1.1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .right-panel {
      flex: 0.9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #b2bec3;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .ip-box {
      background: #f8f9fa;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid #e1e8ed;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    input[type="text"] {
      padding: 8px 12px;
      font-size: 15px;
      width: 140px;
      border: 2px solid #dfe4ea;
      border-radius: 10px;
      outline: none;
      text-align: center;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    .ip-box button {
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      background-color: #0984e3;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .ip-box button:hover {
      background-color: #74b9ff;
    }

    .menu-row {
      display: flex;
      gap: 8px;
    }

    .menu-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-menu {
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #f1f2f6;
      color: #4b6584;
    }

    .btn-menu:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .btn-menu:disabled {
      background-color: #f8f9fa;
      color: #dcdde1;
      cursor: not-allowed;
      transform: none;
      box-shadow: none !important;
    }

    #recordBtn { background-color: #ff7675; color: white; box-shadow: 0 4px 10px rgba(255, 118, 117, 0.3); }
    #stopRecordBtn { background-color: #ffeaa7; color: #d35400; }
    #replayBtn { background-color: #a29bfe; color: white; box-shadow: 0 4px 10px rgba(162, 155, 254, 0.3); }
    #returnBtn { background-color: #55efc4; color: #00b894; box-shadow: 0 4px 10px rgba(85, 239, 196, 0.3); }
    
    #clearBtn {
      background-color: #fab1a0;
      color: #d63031;
      width: 50px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(214, 48, 49, 0.15);
    }
    #clearBtn:hover:not(:disabled) {
      background-color: #ff7675;
      color: white;
    }

    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 12px;
      justify-content: center;
    }

    .control-btn {
      background-color: #ffffff;
      border: 2px solid #e1e8ed;
      border-radius: 20px;
      font-size: 19px;
      font-weight: 700;
      color: #2d3436;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0.03);
      user-select: none;
    }

    .control-btn span {
      font-size: 13px;
      color: #b2bec3;
      margin-top: 5px;
    }

    .control-btn:hover:not(:disabled) {
      border-color: var(--primary-color);
      color: var(--primary-color);
      background-color: #fbfbfe;
    }

    .control-btn:active:not(:disabled), .control-btn.active {
      background-color: var(--primary-color);
      color: white;
      transform: scale(0.95);
    }
    .control-btn.active span { color: #f1f2f6; }

    .control-btn:disabled {
      background-color: #f8f9fa;
      border-color: #f1f2f6;
      color: #dfe4ea;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-forward  { grid-column: 2; grid-row: 1; }
    .btn-left     { grid-column: 1; grid-row: 2; }
    .btn-right    { grid-column: 3; grid-row: 2; }
    .btn-backward { grid-column: 2; grid-row: 3; }

    .log-container {
      width: 100%;
    }

    #log {
      width: 100%;
      height: 100px;
      background: #1e272e;
      border: 1px solid #485460;
      border-radius: 14px;
      padding: 12px 14px;
      box-sizing: border-box;
      overflow-y: auto;
      font-size: 13px;
      font-family: 'Courier New', Courier, monospace;
      color: #0be881;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <h2>✨ ESP32 Smart Robot Remote ✨</h2>

  <div class="main-wrapper">
    
    <div class="panel left-panel">
      <div>
        <div class="section-title">Connection</div>
        <div class="ip-box">
          <span>ESP32 IP</span>
          <input id="espIP" type="text" value="192.168.0.50">
          <button onclick="testESP()">연결 테스트</button>
        </div>
      </div>

      <div class="menu-group">
        <div class="section-title">Control Menu</div>
        <button class="btn-menu" id="recordBtn" onclick="toggleRecord()">🔴 운전 기록 시작</button>
        <button class="btn-menu" id="stopRecordBtn" onclick="stopRecord()" disabled>⏹ 운전 기록 정지</button>
        
        <div class="menu-row">
          <button class="btn-menu" id="replayBtn" onclick="replayPath()" disabled style="flex: 1;">🚗 길 따라가기 (정방향)</button>
          <button class="btn-menu" id="returnBtn" onclick="returnHome()" disabled style="flex: 1;">🏠 제자리 복귀 (역순)</button>
          <button class="btn-menu" id="clearBtn" onclick="clearMemory()" disabled title="기록 삭제">🗑️</button>
        </div>
      </div>

      <div class="log-container">
        <div class="section-title">System Log</div>
        <div id="log">> 대기 중... 기록 시작 버튼을 눌러주세요.</div>
      </div>
    </div>

    <div class="panel right-panel">
      <div class="section-title" style="margin-bottom: 15px;">Driving Pad</div>
      <div class="d-pad">
        <button class="control-btn btn-forward" data-cmd="f" disabled>전진<span>[W]</span></button>
        <button class="control-btn btn-left" data-cmd="l" disabled>좌회전<span>[A]</span></button>
        <button class="control-btn btn-right" data-cmd="r" disabled>우회전<span>[D]</span></button>
        <button class="control-btn btn-backward" data-cmd="b" disabled>후진<span>[S]</span></button>
      </div>
    </div>

  </div>

<script>
    let isRecording = false;
    let isPlaying = false;
    let recordedMemory = []; 
    let currentAction = null;
    let startTime = null;
    let ws = null;

    function testESP(){
      const ip = document.getElementById("espIP").value;
      ws = new WebSocket(`ws://${ip}:81`);
      
      ws.onopen = function() {
        alert("ESP32 웹소켓 연결 성공!");
      };
      ws.onerror = function() {
        alert("ESP32 연결 실패");
      };
    }

    function addLog(msg) {
      const logDiv = document.getElementById("log");
      logDiv.innerHTML += `> ${msg}<br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function sendCmd(cmd) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(cmd);
      }
    }

    function updateMenuButtons(enabled) {
      const hasData = recordedMemory.length > 0;
      document.getElementById("replayBtn").disabled = !(enabled && hasData);
      document.getElementById("returnBtn").disabled = !(enabled && hasData);
      document.getElementById("clearBtn").disabled = !(enabled && hasData);
    }

    function toggleRecord() {
      isRecording = true;
      recordedMemory = []; 
      document.getElementById("recordBtn").disabled = true;
      document.getElementById("stopRecordBtn").disabled = false;
      updateMenuButtons(false);
      document.querySelectorAll('.control-btn').forEach(b => b.disabled = false);
      addLog("운전 기록을 시작합니다.");
    }

    function stopRecord() {
      isRecording = false;
      document.getElementById("recordBtn").disabled = false;
      document.getElementById("stopRecordBtn").disabled = true;
      updateMenuButtons(true);
      document.querySelectorAll('.control-btn').forEach(b => b.disabled = true);
      sendCmd('s');
      addLog(`운전 기록 완료! (총 ${recordedMemory.length}개 동작 저장됨)`);
    }

    function clearMemory() {
      recordedMemory = [];
      updateMenuButtons(false);
      addLog("🗑️ 저장된 주행 기록이 삭제되었습니다.");
    }

    function startAction(cmd) {
      if (!isRecording || isPlaying) return;
      if (currentAction === cmd) return;
      currentAction = cmd;
      startTime = Date.now();
      sendCmd(cmd);

      const btn = document.querySelector(`.control-btn[data-cmd="${cmd}"]`);
      if (btn) btn.classList.add('active');
    }

    function endAction(cmd) {
      if (!isRecording || isPlaying) return;
      if (!currentAction) return;
      
      let duration = (Date.now() - startTime) / 1000; 
      sendCmd('s');

      document.querySelectorAll('.control-btn').forEach(b => b.classList.remove('active'));

      if (duration >= 0.05) {
        recordedMemory.push({ cmd: currentAction, duration: duration });
        let msg = `${duration.toFixed(1)}초 간 동작!`;
        addLog(msg);
      }
      currentAction = null;
    }

    document.querySelectorAll('.control-btn').forEach(btn => {
      const cmd = btn.getAttribute('data-cmd');
      
      btn.addEventListener('mousedown', (e) => { e.preventDefault(); startAction(cmd); });
      btn.addEventListener('mouseup', (e) => { e.preventDefault(); endAction(cmd); });
      btn.addEventListener('mouseleave', (e) => { if (currentAction === cmd) endAction(cmd); });

      btn.addEventListener('touchstart', (e) => { e.preventDefault(); startAction(cmd); });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); endAction(cmd); });
    });

    const keyMap = { 'w': 'f', 'a': 'l', 'd': 'r', 's': 'b' };
    const activeKeys = {};

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (keyMap[key] && !activeKeys[key]) {
        activeKeys[key] = true;
        startAction(keyMap[key]);
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (keyMap[key]) {
        activeKeys[key] = false;
        endAction(keyMap[key]);
      }
    });

    // 정방향 길 따라가기 함수 (오타 수정 완료)
    async function replayPath() {
      if (recordedMemory.length === 0 || isPlaying) return;
      isPlaying = true;
      document.querySelectorAll('.btn-menu').forEach(b => b.disabled = true);
      addLog("🚗 저장된 길 따라가기 시작...");

      for (let step of recordedMemory) {
        sendCmd(step.cmd);
        const btn = document.querySelector(`.control-btn[data-cmd="${step.cmd}"]`);
        if (btn) btn.classList.add('active');

        await new Promise(r => setTimeout(r, step.duration * 1000));

        sendCmd('s');
        if (btn) btn.classList.remove('active');
        await new Promise(r => setTimeout(r, 200));
      }

      isPlaying = false;
      updateMenuButtons(true);
      document.getElementById("recordBtn").disabled = false;
      addLog("🚗 길 따라가기 완료!");
    }

    // 역순(제자리 복귀) 함수
    async function returnHome() {
      if (recordedMemory.length === 0 || isPlaying) return;
      isPlaying = true;
      document.querySelectorAll('.btn-menu').forEach(b => b.disabled = true);
      addLog("🏠 제자리 복귀(역순) 시작...");

      const reversed = [...recordedMemory].reverse().map(step => {
        let oppositeCmd = step.cmd;
        if (step.cmd === 'f') oppositeCmd = 'b';
        else if (step.cmd === 'b') oppositeCmd = 'f';
        else if (step.cmd === 'l') oppositeCmd = 'r';
        else if (step.cmd === 'r') oppositeCmd = 'l';
        return { cmd: oppositeCmd, duration: step.duration };
      });

      for (let step of reversed) {
        sendCmd(step.cmd);
        const btn = document.querySelector(`.control-btn[data-cmd="${step.cmd}"]`);
        if (btn) btn.classList.add('active');

        await new Promise(r => setTimeout(r, step.duration * 1000));

        sendCmd('s');
        if (btn) btn.classList.remove('active');
        await new Promise(r => setTimeout(r, 200));
      }

      isPlaying = false;
      updateMenuButtons(true);
      document.getElementById("recordBtn").disabled = false;
      addLog("🏠 제자리 복귀 완료!");
    }
  </script>
</body>
</html>
