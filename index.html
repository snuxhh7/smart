<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>MediaPipe NeoPixel Touch</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<style>
body{
  margin:0;
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
}
h2{margin:10px}
input{
  padding:7px;
  font-size:16px;
  width:150px;
}
button{
  padding:7px 15px;
  font-size:16px;
}
#status{
  font-size:30px;
  font-weight:bold;
  margin:10px;
}
#box{
  position:relative;
  width:640px;
  height:480px;
  margin:auto;
}
video{
  display:none;
}
canvas{
  position:absolute;
  left:0;
  top:0;
  width:640px;
  height:480px;
}
</style>
</head>
<body>
<h2>MediaPipe NeoPixel Touch</h2>
ESP32 IP :
<input id="espIP" value="192.168.0.23">
<button onclick="testESP()">연결 테스트</button>
<div id="status">LED OFF</div>
<div id="box">
  <video id="video" width="640" height="480" autoplay playsinline></video>
  <canvas id="canvas" width="640" height="480"></canvas>
</div>
<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");
const BUTTON_X = 500;
const BUTTON_Y = 120;
const BUTTON_RADIUS = 55;
let ledOn = false;
let previousTouch = false;
function testESP(){
  const ip = document.getElementById("espIP").value;
  fetch(`http://${ip}/`)
  .then(response => response.text())
  .then(data => {
    alert("ESP32 연결 성공\n" + data);
  })
  .catch(error => {
    alert("ESP32 연결 실패");
  });
}
function sendLED(state){
  const ip = document.getElementById("espIP").value;
  fetch(`http://${ip}/led?state=${state}`)
  .then(response => response.text())
  .then(data => {
    console.log(data);
  })
  .catch(error => {
    console.log("ESP32 통신 오류");
  });
}
function onResults(results){
  ctx.save();
  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
  ctx.drawImage(
    results.image,
    0,
    0,
    canvas.width,
    canvas.height
  );
  ctx.restore();
  if(ledOn){
    ctx.fillStyle="red";
  }else{
    ctx.fillStyle="#500000";
  }
  ctx.beginPath();
  ctx.arc(
    BUTTON_X,
    BUTTON_Y,
    BUTTON_RADIUS,
    0,
    Math.PI*2
  );
  ctx.fill();
  ctx.lineWidth=5;
  ctx.strokeStyle="red";
  ctx.stroke();
  ctx.fillStyle="white";
  ctx.font="bold 20px Arial";
  ctx.textAlign="center";
  ctx.fillText(
    ledOn ? "ON" : "OFF",
    BUTTON_X,
    BUTTON_Y+7
  );
  let currentTouch=false;
  if(results.multiHandLandmarks){
    for(const landmarks of results.multiHandLandmarks){
      const flipped = landmarks.map(p => ({
        x:1-p.x,
        y:p.y,
        z:p.z
      }));
      drawConnectors(
        ctx,
        flipped,
        HAND_CONNECTIONS,
        {
          color:"#00FF00",
          lineWidth:3
        }
      );
      drawLandmarks(
        ctx,
        flipped,
        {
          color:"#00FFFF",
          radius:3
        }
      );
      const tip = flipped[8];
      const x = tip.x * canvas.width;
      const y = tip.y * canvas.height;
      ctx.beginPath();
      ctx.arc(x, y,15, 0, Math.PI*2);
      ctx.fillStyle="yellow";
      ctx.fill();
      const dx = x - BUTTON_X;
      const dy = y - BUTTON_Y;
      const distance = Math.sqrt(dx*dx + dy*dy );
      if(distance < BUTTON_RADIUS){
        currentTouch=true;
        ctx.fillStyle="yellow";
        ctx.font= "bold 25px Arial";
        ctx.fillText("TOUCH",BUTTON_X,BUTTON_Y+90);
      }
    }
  }
  if( currentTouch && !previousTouch){
    ledOn = !ledOn;
    if(ledOn){
      statusText.innerText= "NeoPixel RED ON";
      statusText.style.color= "red";
      sendLED("on");
    }else{
      statusText.innerText="NeoPixel OFF";
      statusText.style.color="white";
      sendLED("off");
    }
  }
  previousTouch =
    currentTouch;
}
const hands = new Hands({
  locateFile:(file)=>{
    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }
});
hands.setOptions({
  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:0.7,
  minTrackingConfidence:0.7
});
hands.onResults(onResults);
const camera = new Camera(
  video,
  {
    onFrame:async()=>{
      await hands.send({
        image:video
      });
    },
    width:640,
    height:480
  }
);
camera.start();
</script>
</body>
</html>
